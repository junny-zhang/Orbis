# Orbis 右手（外围 / peripheral）用户配置
# 文件名必须与 shield 名一致：orbis_right.conf

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# 外围侧要跑 PMW3360 驱动
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y

# PMW3360 驱动线程（下面都是驱动的默认值，一般不用改）
# CONFIG_INPUT_PIXART_PMW3360_USE_OWN_THREAD=y
# CONFIG_INPUT_PIXART_PMW3360_THREAD_PRIORITY=5
# CONFIG_INPUT_PIXART_PMW3360_THREAD_STACK_SIZE=768

# ---- 省电 ----
# CONFIG_ZMK_IDLE_TIMEOUT=30000
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# CONFIG_ZMK_SLEEP=y
