# Orbis 左手（中央 / central）用户配置
# 文件名必须与 shield 名一致：orbis_left.conf

CONFIG_ZMK_KEYBOARD_NAME="Orbis"

# 蓝牙 + USB 双模（nice!nano 板级 defconfig 已默认打开，这里显式再写一遍便于阅读）
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# 指针功能：中央侧需要一个监听器来接收右手转发来的轨迹球事件
CONFIG_ZMK_POINTING=y

# 左手 EC11 编码器
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---- 省电（先跑通再逐条打开，打开了要重新配对一次） ----
# CONFIG_ZMK_IDLE_TIMEOUT=30000
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# CONFIG_ZMK_SLEEP=y

# ---- 蓝牙发射功率（信号弱时可以试） ----
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---- SSD1306 OLED（装在外壳上，经左下角 J3 的 4 个接线焊盘接入）----
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
